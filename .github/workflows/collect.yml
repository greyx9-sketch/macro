name: 매크로 지표 수집

# ★ 매일 돌아야 하는 이유 ★
#   ForexFactory 컨센서스 피드는 '이번 주'만 제공한다. lastweek/nextweek 는 404다.
#   한 주를 통째로 놓치면 그 주의 예측값은 영원히 복구할 수 없다.
#   주 5회 중복 캡처로 하루이틀 장애를 흡수하도록 매일 실행한다.

on:
  schedule:
    # 09:10 UTC = 18:10 KST. 미국 지표 대부분이 08:30 ET(12:30/13:30 UTC)에 나오므로
    # 그날 발표를 담으려면 늦은 시각이 유리하다. 두 번 돌려 여유를 둔다.
    - cron: '10 9 * * *'
    - cron: '10 21 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: '특정 소스만 실행 (fred / forexfactory / ecos / cds)'
        required: false
      skip_cds:
        description: 'CDS 건너뛰기'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: macro-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Playwright 는 CDS 수집에만 쓰인다. 설치가 실패해도 워크플로는 계속된다 —
      # 나머지 16종 수집이 브라우저 하나 때문에 막히면 안 된다.
      - name: Playwright 설치 (CDS 전용, 선택)
        continue-on-error: true
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: 수집
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.only }}" ]; then
            ARGS="--only ${{ github.event.inputs.only }}"
          fi
          if [ "${{ github.event.inputs.skip_cds }}" = "true" ]; then
            ARGS="$ARGS --no-cds"
          fi
          python scripts/collect.py $ARGS

      - name: JSON 내보내기
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/export_json.py

      # CSV 를 커밋하는 것이 이 설계의 핵심이다.
      # 텍스트라 git 이 델타 압축을 하므로 하루치 변경이 몇 줄로 남고,
      # `git log -p data/observations.csv` 가 곧 사람이 읽는 수정치 감사 로그가 된다.
      # (SQLite 는 CSV 에서 재생성되는 파생물이라 커밋하지 않는다.)
      - name: 데이터 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.csv site/data/dashboard.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "데이터 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
