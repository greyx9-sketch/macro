name: 매크로 지표 수집

# ★ 매일 돌아야 하는 이유 ★
#   ForexFactory 컨센서스 피드(JSON)는 '이번 주'만 제공한다. lastweek/nextweek 는 404다.
#   그래서 오랫동안 "놓친 주는 영원히 복구할 수 없다" 를 전제로 설계했다.
#
#   지금은 사실이 조금 다르다. 캘린더 **웹페이지**는 `?week=aug3.2026` 형태로
#   과거 주를 돌려주고(2020년까지 확인), scripts/backfill_ff_weeks.py 가 그걸 쓴다.
#   그래도 매일 도는 이유는 남는다 — 복구는 수동 작업이고, 발표 당일에 받는 편이
#   개정 전 원본에 가깝다.
#
# ★ 시각을 너무 믿지 말 것 ★
#   실측(Actions API): 예정 09:10 → 실제 16:13~17:17, 예정 21:10 → 실제 00:14~08:51.
#   지연이 3~12시간까지 벌어진다. GitHub 의 스케줄 큐는 정시·10분 단위에 몰리므로
#   혼잡한 분을 피해 홀수 분으로 옮긴다. 그래도 정시성을 보장받지는 못한다.
#   설계가 특정 시각에 의존하지 않게 두는 것이 더 중요하다.

on:
  schedule:
    # 13:37 UTC — 미국 오전 발표(08:30 ET = 12:30/13:30 UTC) 직후.
    - cron: '37 13 * * *'
    # 01:43 UTC — 지연을 감안한 보정 실행. 앞 실행이 밀렸어도 그날 안에 한 번은 돈다.
    - cron: '43 1 * * *'

  # 코드를 고쳐도 재배포되지 않아 사이트가 낡은 채로 남는 문제가 있었다.
  # push 로도 배포한다.
  #
  # 무한 루프 방지: 이 워크플로가 커밋하는 경로를 전부 제외해야 한다.
  # data/** 뿐 아니라 **site/data/** 도 커밋 대상이므로 같이 빼지 않으면
  # 봇 커밋이 다시 워크플로를 부른다.
  # (GITHUB_TOKEN 으로 만든 커밋은 원래 워크플로를 재실행시키지 않지만,
  #  그 동작에만 의존하지 않고 명시적으로 막아 둔다.)
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'site/data/**'
      - '**.md'

  workflow_dispatch:
    inputs:
      only:
        description: '특정 소스만 실행 (fred / forexfactory / forexfactory_html / ecos / cds)'
        required: false
      skip_cds:
        description: 'CDS 건너뛰기'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: macro-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Playwright 는 CDS 수집에만 쓰인다. 설치가 실패해도 워크플로는 계속된다 —
      # 나머지 16종 수집이 브라우저 하나 때문에 막히면 안 된다.
      - name: Playwright 설치 (CDS 전용, 선택)
        continue-on-error: true
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: 수집
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.only }}" ]; then
            ARGS="--only ${{ github.event.inputs.only }}"
          fi
          if [ "${{ github.event.inputs.skip_cds }}" = "true" ]; then
            ARGS="$ARGS --no-cds"
          fi
          python scripts/collect.py $ARGS

      - name: JSON 내보내기
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/export_json.py

      # CSV 를 커밋하는 것이 이 설계의 핵심이다.
      # 텍스트라 git 이 델타 압축을 하므로 하루치 변경이 몇 줄로 남고,
      # `git log -p data/observations.csv` 가 곧 사람이 읽는 수정치 감사 로그가 된다.
      # (SQLite 는 CSV 에서 재생성되는 파생물이라 커밋하지 않는다.)
      - name: 데이터 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 커밋 여부는 **CSV 기준으로만** 판단한다.
          # dashboard.json 에는 generatedAt 타임스탬프가 들어 있어 내용이 같아도 매번 바뀐다.
          # 그걸 기준으로 삼으면 새 데이터가 하나도 없는 날에도 커밋이 쌓인다.
          git add data/*.csv
          if git diff --staged --quiet; then
            echo "새 데이터 없음 — 커밋 생략 (Pages 배포는 계속 진행)"
          else
            git add site/data/dashboard.json
            git commit -m "데이터 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
